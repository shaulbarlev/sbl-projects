# Push to main deploys to sbl.cx.
#
# The suite runs first and a failure stops the deploy. This code is reached by
# a QR that is already printed and handed out: a bad deploy is not a page you
# can roll back before anyone notices, it is a piece of card in someone's
# pocket pointing at the wrong place.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; the later push wins.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # wrangler is already a pinned devDependency, so this deploys with the
      # same version used locally rather than whatever an action bundles.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
