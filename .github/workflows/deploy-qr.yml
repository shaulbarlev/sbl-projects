# A push to main that touches qr/ deploys the QR Worker to sbl.cx. (The site
# itself is deployed by Cloudflare Workers Builds from the repo root.)
#
# The suite runs first and a failure stops the deploy. This code is reached by
# a QR that is already printed and handed out: a bad deploy is not a page you
# can roll back before anyone notices, it is a piece of card in someone's
# pocket pointing at the wrong place.
name: Deploy QR

on:
  push:
    branches: [main]
    paths: ['qr/**', '.github/workflows/deploy-qr.yml']
  workflow_dispatch:

# Never let two deploys race; the later push wins.
concurrency:
  group: deploy-qr
  cancel-in-progress: false

defaults:
  run:
    working-directory: qr

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qr/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # wrangler is already a pinned devDependency, so this deploys with the
      # same version used locally rather than whatever an action bundles.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
