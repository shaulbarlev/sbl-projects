name = "q-redirect"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# The QR points at sbl.cx. The other domains come here too, each pointed on its
# own from the panel (a custom domain's DNS record is the Worker's to manage).
routes = [
  { pattern = "sbl.cx", custom_domain = true },
  { pattern = "shaulb.com", custom_domain = true },
  { pattern = "www.shaulb.com", custom_domain = true },
  { pattern = "shaulbarlev.com", custom_domain = true },
  { pattern = "www.shaulbarlev.com", custom_domain = true },
]

[vars]
# Only reached without the SITE binding below (the site is what the root falls
# back to). Never a 404 — a QR that resolves to an error is worse than one that
# resolves somewhere boring.
FALLBACK_URL = "https://sbl.cx"

[[durable_objects.bindings]]
name = "STATE"
class_name = "RedirectState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RedirectState"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "skin-files"

# The site at sbl.cx: the map of projects (repo sbl-projects). Served for every
# path the QR does not own, and at the root when nothing is set.
[[services]]
binding = "SITE"
service = "sbl-projects"

# Secrets, set with `wrangler secret put <NAME>` — never in this file:
#   ADMIN_PASSWORD  the admin password
#   SESSION_SECRET  random string used to sign session cookies
#   GIPHY_API_KEY   optional; enables the GIF search in the panel
#   API_TOKEN       optional; bearer token for scripts and the iOS Shortcut
#   AGENT_TOKEN     optional; bearer token the home agent connects with
